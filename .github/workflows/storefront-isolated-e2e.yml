name: Isolated Supabase storefront E2E

on:
  pull_request:
    branches:
      - feat/merchant-product-management
      - main

concurrency:
  group: haoshiguang-storefront-e2e-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  storefront-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci
      - name: Report dependency audit findings
        shell: bash
        run: |
          npm audit --json > /tmp/npm-audit.json || true
          node <<'NODE'
          const fs = require("node:fs");
          const audit = JSON.parse(fs.readFileSync("/tmp/npm-audit.json", "utf8"));
          const findings = Object.entries(audit.vulnerabilities || {}).map(([name, item]) => ({
            package: name,
            severity: item.severity,
            range: item.range,
            direct: item.isDirect,
            fixAvailable: item.fixAvailable,
            via: item.via.map(entry => typeof entry === "string" ? entry : {
              title: entry.title,
              url: entry.url,
              range: entry.range,
            }),
          }));
          console.log(JSON.stringify({
            totals: audit.metadata?.vulnerabilities || {},
            findings,
          }, null, 2));
          NODE
      - name: Verify lint and TypeScript independently
        run: |
          npm ls minimatch eslint-plugin-import @typescript-eslint/typescript-estree || true
          npm run lint
          npm run typecheck

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Install Supabase CLI
        uses: supabase/setup-cli@v3
        with:
          # Keep CLI v2 until the local Supabase config is explicitly migrated to v3.
          version: v2.stable

      - name: Start disposable local Supabase
        run: supabase start -x realtime,storage-api,imgproxy,studio,edge-runtime,logflare,vector,supavisor,mailpit,postgres-meta

      - name: Reset isolated database and apply all migrations
        run: supabase db reset

      - name: Export local Supabase connection values
        shell: bash
        run: |
          supabase status -o env > /tmp/supabase-status.env
          node <<'NODE'
          const fs = require("node:fs");
          const raw = fs.readFileSync("/tmp/supabase-status.env", "utf8");
          const values = {};
          for (const line of raw.split(/\r?\n/)) {
            const match = line.match(/^([A-Z_]+)=(.*)$/);
            if (!match) continue;
            let value = match[2].trim();
            if (value.startsWith('"') && value.endsWith('"')) value = JSON.parse(value);
            values[match[1]] = value;
          }
          const required = ["API_URL", "ANON_KEY", "SERVICE_ROLE_KEY", "DB_URL"];
          for (const key of required) if (!values[key]) throw new Error("Missing local Supabase value: " + key);
          const env = [
            "NEXT_PUBLIC_SUPABASE_URL=" + values.API_URL,
            "NEXT_PUBLIC_SUPABASE_ANON_KEY=" + values.ANON_KEY,
            "SUPABASE_SERVICE_ROLE_KEY=" + values.SERVICE_ROLE_KEY,
            "DB_URL=" + values.DB_URL,
          ].join("\n") + "\n";
          fs.appendFileSync(process.env.GITHUB_ENV, env);
          NODE

      - name: Seed pilot catalog into disposable Supabase
        run: psql "$DB_URL" -v ON_ERROR_STOP=1 -f supabase/seed/001_laozhang_pilot.sql

      - name: Create isolated merchant login fixture
        run: node scripts/e2e/create-merchant-user.mjs

      - name: Build application against local Supabase
        run: npm run build

      - name: Run browser-based storefront and merchant workflow
        run: npm run test:e2e

      - name: Stop disposable Supabase
        if: always()
        run: supabase stop --no-backup
