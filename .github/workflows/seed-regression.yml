name: Seed regression validation

on:
  push:
    branches:
      - feat/customer-ordering-storefront
      - feat/secure-order-checkout
      - feat/merchant-order-management
      - feat/merchant-product-management
      - feat/merchant-business-settings

permissions:
  contents: write
  pull-requests: write

jobs:
  seed-regression:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: haoshiguang_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d haoshiguang_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/haoshiguang_test
    steps:
      - uses: actions/checkout@v4
      - name: Sync latest upstream PR branch
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          gh pr update-branch 2 --repo "$GITHUB_REPOSITORY"
          git fetch origin "$GITHUB_REF_NAME"
          git reset --hard "origin/$GITHUB_REF_NAME"
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Validate local database URL guard
        run: node --test scripts/tests/*.test.mjs
      - name: Run isolated PostgreSQL migration and seed regression tests
        run: bash scripts/test-db.sh
