name: Merchant business settings validation

on:
  pull_request:
    branches:
      - feat/merchant-product-management
      - feat/merchant-business-settings
      - main
      - feat/merchant-store-profile

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: haoshiguang_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d haoshiguang_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/haoshiguang_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Build
        run: npm run build
      - name: URL guard and trusted client-IP unit tests
        run: npm run test:url
      - name: Isolated PostgreSQL RLS and checkout integration tests
        run: bash scripts/test-merchant-db.sh
